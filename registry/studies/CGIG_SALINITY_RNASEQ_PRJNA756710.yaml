phenotype_direction: "Higher mortality after Vibrio infection is unfavorable; infected oysters reached 100% mortality at 10 ppt versus 33% at 30 ppt over 12 days (log-rank p < 0.01, n = 30 per tank in triplicate). AREE records the gill transcriptional response to low salinity during infection, not survival per library."
