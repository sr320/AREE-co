sample_size: 12
biological_replication: "12 RNA-seq libraries used for the contrast: 6 at 30 ppt and 6 at 10 ppt, three per salinity at each of 12 h and 48 h. Each library pools equal gill tissue from three oysters taken from one tank. Two further 0 h libraries (SRR15559848, SRR15559847) are shared pre-transfer baselines with no salinity contrast and are not used."
