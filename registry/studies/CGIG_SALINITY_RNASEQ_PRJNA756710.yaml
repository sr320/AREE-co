limitations:
  - "Every sequenced oyster was infected with Vibrio alginolyticus, so the contrast estimates the effect of low salinity during infection, not of low salinity alone. The uninfected, sham-injected controls held at 30 ppt were used for the survival curve only and were not sequenced. stressor_class is salinity because salinity is the only factor that differs between the contrasted arms."
  - "The primary AREE contrast pools 12 h and 48 h and blocks on sampling time (~ timepoint + condition). It estimates a low-salinity effect averaged over the two times, whereas the publication tested each time separately; each time-by-salinity cell has only three libraries."
  - "Each salinity arm used three tanks, and a pool of three oysters was taken from each tank at each time, so the 12 h and 48 h libraries with the same replicate number may share a tank. The public metadata do not state that replicate numbers correspond to tanks, so the model does not pair them."
  - "Oyster age or size class is not given beyond an average wet weight of 18.2 +/- 2.8 g, so life_stage is not recorded. Temperature during the challenge is not reported."
  - "The library names use C23 for the normal-salinity arm, but the publication and BioSample titles give the normal salinity as 30 ppt; C10 matches the 10 ppt arm."
  - "Condition, time and replicate come from the NCBI BioSample titles. They agree with the library names (C10/C23 followed by 1-3 for 12 h and 4-6 for 48 h), and the raw read count of every library matches publication Supplementary Table 3."
  - "The publication aligned reads with HISAT2 to GCA_902806645.1, counted them with featureCounts and ran DESeq2 per time point (padj < 0.05, |fold change| > 1). It reports 3,038 DEGs at 12 h (1,731 higher, 1,307 lower at 10 ppt) and 3,187 at 48 h (1,656 higher, 1,531 lower) in Supplementary Table 4, keyed by RefSeq LOC identifiers. Only significant genes are listed, so the table cannot be used as a full ranked result."
  - "The companion 16S rRNA amplicon data for the digestive gland are in the separate BioProject PRJNA756403 and are outside this record."
