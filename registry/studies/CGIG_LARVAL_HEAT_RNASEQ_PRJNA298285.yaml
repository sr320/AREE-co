quality_control_status: "All 24 larval libraries (598,102,958 read pairs) quantified with Salmon 2.3.4 against GCF_963853765.1/RS_2024_06 from NCBI .sra archives that match NCBI's MD5s; mapping rates are low and variable for whole larvae (29.2-56.8%, median 48.4%; ambient 49.1%, acidified 44.8%, warmed 49.6%, acidified + warmed 46.4%). Expressed-SNP allele frequencies at 898 sites show every library is a pool from one larval cohort: all pairs lie within about 0.01-0.03 of same-RNA noise, so treatment is not confounded with parentage. The A and B libraries of a cell are no closer genetically than libraries of other treatments at the same stage (excess over noise 0.008 against 0.0085), so there is no sign of resequenced RNA, but pools of one cohort cannot show whether A and B are separate cultures; their expression profiles are nearly identical, so they may be subsamples of one culture. Allele frequencies diverge more between stages than within (excess 0.017 against 0.0085), consistent with selection or allele-specific expression during development. PC1 (77-81% of variance) is developmental stage. Warmed larvae are developmentally ahead of ambient larvae of the same age: on PC1 the early veligers move from -6.8 to 22.2 (about 70% of the way to the late-veliger profile at 35.0), with smaller shifts at the trochophore (-49.8 to -40.8) and late veliger (35.0 to 40.1) stages. ~ stage + condition (6 v 6) gives 3,295 of 19,864 tested genes at FDR < 0.05, but most reflect developmental stage rather than a thermal response, and with two libraries per cell developmental progress cannot be modelled separately, so the record is not harmonized."
analysis_status: "raw_reanalysis_complete_not_harmonized"
provenance:
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA298285"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA298285"
