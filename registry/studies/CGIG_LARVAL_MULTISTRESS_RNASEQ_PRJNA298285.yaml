biological_replication: "12 whole-larva libraries: 6 ambient and 6 acidified and warmed (pH 7.9, 22 C), two per developmental stage. Each library is presumably a pool of many larvae; whether the two libraries per cell are separate cultures or one culture is not recorded and is tested with the expressed-SNP check."
platform: "Illumina HiSeq 2000, paired-end (101 bp; one library, D5236_Trc_warmA, 126 bp)"
