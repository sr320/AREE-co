    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA298285"
  curator: "AREE contributors"
  curation_date: "2026-10-07"
limitations:
  - "No publication is linked to the BioProject, and searches of PubMed and Europe PMC (including the accessions PRJNA298285 and SRP064660) on 2026-10-07 found none, so there are no published methods, carbonate chemistry, survival data or results to reconcile against."
  - "The three AREE records from this study (acidified, warmed, acidified + warmed) test against the same six ambient libraries, so they carry the dependence group PRJNA298285_ambient_larvae and count as one replication group."
  - "There are two libraries per stage and treatment. The stage block (~ stage + condition) treats them as replicates; whether they come from separate cultures is not recorded and is checked with scripts/check_replicate_genotypes.py."
  - "The treatments are mild (pH 7.9 against 8.1; 22 C against 20 C), so small transcriptional effects are expected."
  - "Treatment, stage and replicate come from the ENA sample aliases (C.gigas_<stage>_<treatment>) and library names (<id>_<Trc | Vg1 | Vg2>_<ambi | acid | warm | intr><A | B>), and agree with the BioSample pH, temperature, dev_stage and age attributes. One library name is a file name (C3759_TAGCTT_L003_R1_001.fastq.gz, late-veliger warmed); it is taken as replicate B because the other late-veliger warmed library is C3752_Vg2_warmA. One library (D5236_Trc_warmA) is from a later sequencing batch at 126 bp."
  - "All runs come from NCBI .sra archives checked against NCBI's MD5s, with read counts checked against the manifest on conversion."
