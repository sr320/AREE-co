citation: "University of Brest. RNA-seq of Pacific oyster Crassostrea gigas larvae (trochophore, early and late veliger) reared under two pH and two temperature levels. NCBI BioProject PRJNA298285; public 2015. No linked publication identified."
species: "Crassostrea gigas"
strain_population_family: "Larvae from broodstock of Point du Chateau, Finistere, France (2013); number of parents and crosses not recorded"
