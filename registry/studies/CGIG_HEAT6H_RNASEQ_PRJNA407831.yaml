citation: "Li A, Li L, Wang W, Song K, Zhang G. Transcriptomics and fitness data reveal adaptive plasticity of thermal tolerance in oysters inhabiting different tidal zones. Front Physiol. 2018;9:825."
species: "Crassostrea gigas"
strain_population_family: "F1 offspring of wild intertidal and subtidal oysters from Bayuquan (40 18 N) and Laoting (39 16 N), Bohai Sea, China, produced by mass spawning (30 females x 30 males per population) and reared in a common garden"
