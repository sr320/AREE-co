limitations:
  - "Both AREE records from this study (the other is CGIG_HEAT24H_RNASEQ_PRJNA407831, 24 h) test against the same twelve 0 h pools, so they carry the dependence group PRJNA407831_0h_pools and count as one replication group."
  - "Each library pools gill RNA of five oysters, so the error model describes tank-pool variation, not variation between animals. The sister IOCAS study PRJNA826964 deposited resequenced RNA as replicates, so these pools were checked with the expressed-SNP test (scripts/check_replicate_genotypes.py) before analysis."
  - "The model blocks on the four source populations (~ population + condition), so the effect is averaged over intertidal and subtidal origins and the two sites; the publication's main result, that intertidal oysters respond with more plasticity, is not part of this record. A tank-paired model (~ tank + condition) is kept as a sensitivity analysis."
  - "Sample aliases code tidal origin as J or X (for example BYQJ01, LTX243); the publication uses I (intertidal) and S (subtidal), and the BioSamples do not record it. J and X are read as the Chinese jian (intertidal) and xia (subtidal), but no AREE result depends on that reading because population is a blocking factor."
  - "The publication discarded one library, LT-I_0h_2, as an outlier; AREE applies its own QC to all 36 libraries."
  - "ENA served other studies at 0.05-0.35 MB/s in October 2026, so all runs come from NCBI .sra archives checked against NCBI's MD5s, with read counts checked against the manifest on conversion."
