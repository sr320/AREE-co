biological_replication: "24 libraries: 12 at 0 h and 12 at 6 h. Each library pools equal gill RNA from five oysters of one culture tank; four populations (two sites x intertidal or subtidal origin) x three tanks, and the same tanks are sampled at each time."
platform: "Illumina HiSeq 2000, TruSeq Stranded mRNA, about 2 x 150 bp paired-end"
