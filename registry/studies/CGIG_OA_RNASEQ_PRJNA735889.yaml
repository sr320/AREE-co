experimental_treatment: "Juveniles held 23 days at mean pHT 6.5-6.8 (tanks 9 and 15 at 6.5, 16 at 6.6, 7 at 6.7, 14 at 6.8), below the 7.3-6.9 tipping-point window the authors report; condition label acidified"
control_condition: "Juveniles held 23 days at mean pHT 7.4-7.8 (tanks 13 at 7.4, 17 at 7.5, 8 at 7.6, 5 at 7.7, 3 at 7.8), above the tipping-point window; condition label control. No tank was held at ambient pH (about 8.0)."
stressor_class: "ocean_acidification_pH"
