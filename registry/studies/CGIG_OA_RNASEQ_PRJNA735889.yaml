limitations:
  - "The study is a 15-level pH gradient (pHT 6.5-7.8, 76 libraries). AREE reduces it to a two-group contrast at the authors' tipping-point window: the five tanks inside pHT 7.3-6.9 (tanks 1, 6, 4, 11 and 10; 25 libraries) are excluded and not downloaded. Effect sizes are therefore log2 fold changes between two pH bands, not slopes per pH unit, and they mix the response across five pH levels on each side."
  - "There is no ambient-pH tank; the reference band (pHT 7.4-7.8) is itself below present-day coastal pH, so the contrast understates the full response to acidification."
  - "Each pH level is a single tank, so tank and pH are confounded at the level of a single pH; with five tanks per band the band contrast has tank-level replication, but DESeq2 treats the 51 oysters as independent and does not model tank. Tank effects should be checked from the PCA and per-tank residuals."
  - "Tank 15 is labelled 'pHT 6.5 bis' in BioSample: a second tank at pHT 6.5 alongside tank 9."
  - "Library 13Ebis (SRR14803132) has a different index from 13E (SRR14803133) and about half its reads; whether it is a separate oyster or a resequencing of 13E is to be settled by the expressed-SNP check (scripts/check_replicate_genotypes.py)."
  - "Condition, tank and pH come from the NCBI BioSample title, treatment and growth_protocol attributes; every library is paired-end with ENA FASTQ MD5s recorded in the manifest."
