control_condition: "Juveniles held 23 days at mean pHT 7.4-7.8 (tanks 13 at 7.4, 17 at 7.5, 8 at 7.6, 5 at 7.7, 3 at 7.8), above the tipping-point window; condition label control. No tank was held at ambient pH (about 8.0)."
