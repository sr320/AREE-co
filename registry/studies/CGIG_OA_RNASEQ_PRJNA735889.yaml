  timing: "5-month-old juveniles, sampled 2019-02-19"
phenotype: "acidification_tolerance"
phenotype_direction: "Lutier et al. report physiological tipping points at pHT 7.3-6.9 that coincide with a major reshuffling of the transcriptome and membrane lipids; AREE records the whole-animal transcriptional response below the tipping window relative to above it, not a measured tolerance phenotype"
phenotype_units: null
resilience_classification: "environmental_exposure"
sample_size: 50
biological_replication: "50 oysters, one whole-animal library each: 25 control and 25 acidified, 5 per tank. A 51st library, 13Ebis, is a resequencing of oyster 13E and is not analysed. Each pH level is one tank, so oysters are replicates within tank and the 10 tanks are the replicates of the pH contrast."
platform: "Illumina NovaSeq 6000, 150 bp paired-end"
data_availability:
  raw: true
  processed: true
  status: "public_raw_aree_reanalysis_complete"
quality_control_status: "All 1,717,290,624 read pairs from 50 single-oyster libraries quantified with Salmon 2.3.4 against GCF_963853765.1/RS_2024_06 (51 runs from NCBI .sra archives; 13Ebis left out as a resequencing of oyster 13E); mapping rates 71.27-83.67% (median 78.58%), not different between bands (control 78.8% versus acidified 78.0%, Welch t = 1.29). Expressed-SNP allele frequencies at 1,073 sites show every library is one diploid animal (35-47% heterozygous sites) and that oysters differ as much within tanks as between them (0.334 versus 0.335), so tanks were stocked from one cohort and pH is not confounded with genetic background; 13E and 13Ebis differ by 0.026 against 0.032 expected for one RNA resequenced. PC1 of the unadjusted model is a male gametogenesis programme (428 genes at r < -0.9 with PC1: axonemal dyneins, calaxin, ropporin, synaptonemal-complex genes, cyclin B3) active in 11 of 25 control and 2 of 25 acidified oysters (Fisher p = 0.008), spread over all five control tanks. The primary model is ~ gametogenesis + condition (25 v 25): 4,725 of 28,811 tested genes reach nominal FDR < 0.05 under an oyster-level model that does not account for tank clustering; this significance is exploratory (2,735 acidified-higher, 1,990 acidified-lower). The unadjusted ~ condition model gives 6,739; 4,058 genes are significant in both and 97.2% of unadjusted significant genes keep their direction (log2FC r = 0.71). Top genes include a monocarboxylate transporter and Kunitz protease inhibitors up and the shell-matrix protein N66, parathyroid-hormone receptors and arginine kinase down."
analysis_status: "raw_reanalysis_harmonized_exploratory_tank_clustering_unmodeled"
