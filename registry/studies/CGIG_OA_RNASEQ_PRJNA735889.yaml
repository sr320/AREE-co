limitations:
  - "The study is a 15-level pH gradient (pHT 6.5-7.8, 76 libraries). AREE reduces it to a two-group contrast at the authors' tipping-point window: the five tanks inside pHT 7.3-6.9 (tanks 1, 6, 4, 11 and 10; 25 libraries) are excluded and not downloaded. Effect sizes are therefore log2 fold changes between two pH bands, not slopes per pH unit, and they mix the response across five pH levels on each side."
  - "There is no ambient-pH tank; the reference band (pHT 7.4-7.8) is itself below present-day coastal pH, so the contrast understates the full response to acidification."
  - "Each pH level is a single tank, so tank and pH are confounded at the level of a single pH; with five tanks per band the band contrast has tank-level replication, but DESeq2 treats the 50 analysed oysters as independent and does not model tank. Standard errors, p-values and FDR values are exploratory and may overstate precision. A tank-aware reanalysis is required before inferential use; PCA and per-tank residual checks do not correct the error model."
  - "Tank 15 is labelled 'pHT 6.5 bis' in BioSample: a second tank at pHT 6.5 alongside tank 9."
  - "Library 13Ebis (SRR14803132) has a different index from 13E (SRR14803133) and about half its reads. The expressed-SNP check shows it is the same oyster (allele-frequency difference 0.026, below the 0.032 expected for one RNA resequenced; the next closest pair differs by 0.198), so it is kept in the manifest but left out of the analysis."
  - "Male gametogenesis is unbalanced between bands: a spermatogenesis module is active in 11 of 25 control and 2 of 25 acidified oysters (Fisher p = 0.008), spread across all five control tanks, which suggests that low pH delays or suppresses the onset of spermatogenesis in 5-month-old juveniles. The primary model blocks on this call (~ gametogenesis + condition) so the evidence records a gametogenesis-adjusted association with pH, without establishing a direct causal response; the unadjusted model is kept as a sensitivity analysis. The call is a transcriptional proxy derived from the same data (scripts/score_prjna735889_gametogenesis.py), not a histological sex or maturation call, and with only two active acidified oysters the gametogenesis effect is estimated mostly from the control band."
  - "Condition, tank and pH come from the NCBI BioSample title, treatment and growth_protocol attributes; every library is paired-end. ENA served the FASTQs at about 80 KB/s on 2026-10-02, so all 51 runs are taken from the NCBI Open Data mirror as .sra archives checked against the size and MD5 NCBI publishes (CGIG_OA_RNASEQ_PRJNA735889_sra_locations.tsv), and each converted FASTQ pair must match the manifest read count."
