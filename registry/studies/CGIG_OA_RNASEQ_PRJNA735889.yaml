citation: "Lutier M, Di Poi C, Gazeau F, Appolis A, Le Luyer J, Pernet F. Revisiting tolerance to ocean acidification: Insights from a new framework combining physiological and molecular tipping points of Pacific oyster. Glob Chang Biol. 2022;28(10):3333-3348."
species: "Crassostrea gigas"
strain_population_family: "Standardized Ifremer juveniles (NSI), one hatchery cohort produced in August 2018 at Argenton, Brittany, France"
