biological_replication: "44 ctenidium libraries analysed, one oyster each (23 controls and 21 treated after QC exclusions), from 48 sequenced: 24 controls and 24 30 C, 12 diploid and 12 triploid in each arm. The 24 control libraries are shared with CGIG_MULTISTRESS_RNASEQ_PRJNA913164 (30 C followed by 44 C emersion)."
platform: "Illumina NovaSeq 6000, QuantSeq 3' mRNA-Seq (Tag-seq), 101 bp single-end"
data_availability:
  raw: true
  processed: true
  status: "public_raw_aree_reanalysis_complete"
quality_control_status: "Salmon 2.3.4 (--noLengthCorrection, sequence-bias correction) against GCF_963853765.1/RS_2024_06 on all 72 QuantSeq libraries; mapping rates are low for 3' tag-seq against the annotated transcriptome (18.7-46.4%, median 34.3%, among the 63 analysed libraries) but similar across arms (control 31.7%, 30 C 33.5%). Nine libraries were left out because their median VST correlation with the other libraries fell below the median minus three robust SDs (0.834): N56, X44, X42, T62, R53, N54 and M43, which the authors also excluded, and R62 and N57; the authors' eighth exclusion, D54, passes and is kept. Tested as ~ ploidy + condition on counts without the tximport length offset (23 control v 21 30 C): 4,394 of 18,085 tested genes reach FDR < 0.05 (2,216 higher, 2,178 lower); PC1 11.7%, PC2 8.3%. A ploidy-by-treatment likelihood-ratio test finds 10 genes with FDR < 0.05; within-ploidy Wald tests give 2,892 diploid and 2,249 triploid significant genes, with log2 fold changes correlated 0.35 across all tested genes. Of the publication's diploid and triploid 30 C gene lists, 90.1% and 97.0% of genes tested here change in the same direction (98.5% and 99.4% among genes also significant here). The response: ER chaperones and splicing factors rise (78 kDa glucose-regulated protein, calreticulin, protein disulfide-isomerase A6, SR splicing factors; 13 of 19 significant heat shock protein genes higher) while high-mobility-group proteins and nucleolin fall."
analysis_status: "raw_reanalysis_harmonized"
provenance:
  source_links:
