phenotype_direction: "The publication found that parental exposure drove the offspring phenotype more than direct exposure: offspring of exposed parents had lower epinephrine-induced metamorphosis and field survival, and RNA-seq and methyl-seq separated offspring by F0 treatment. AREE records the intergenerational transcriptional effect averaged over two stages."
