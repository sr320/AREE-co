citation: "Sol Dourdin T, Guyomard K, Rabiller M, Houssais N, Cormier A, Le Monier P, Sussarellu R, Riviere G. Ancestors' gift: parental early exposure to the environmentally realistic pesticide mixture drives offspring phenotype in a larger extent than direct exposure in the Pacific oyster, Crassostrea gigas. Environ Sci Technol. 2024;58(4):1865-1876."
species: "Crassostrea gigas"
strain_population_family: "Hatchery-produced oysters (Ifremer, Bouin, Pays de la Loire, France); F1 generation from F0 parents exposed or not during their own embryo-larval development"
