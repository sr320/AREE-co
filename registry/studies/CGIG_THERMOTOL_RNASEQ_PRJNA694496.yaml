limitations:
  - "The RNA-seq comparison is constitutive selected-versus-control expression at the larval stage, not an acute heat-versus-control contrast."
  - "Thermotolerance survival was measured in related later-stage cohorts rather than the RNA-sequenced larval pools."
  - "The publication reports 4,764 DEGs but does not provide the complete feature-level effect, p-value, or standard-error table in its supplementary archive."
  - "The publication describes three replicates per group but does not report how many larvae were pooled into each RNA-seq library."
  - "All six runs share one BioSample record, and its tissue field says gill despite the publication consistently describing whole umbo larvae; AREE follows the publication for tissue and records the discrepancy."
  - "The source genome assembly and differential-expression software/threshold are not reported clearly enough for exact reproduction; AREE will reanalyze against a versioned current reference."
