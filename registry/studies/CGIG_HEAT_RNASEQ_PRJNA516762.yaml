quality_control_status: "All 154,861,045 read pairs quantified with Salmon 2.3.4 against GCF_963853765.1/RS_2024_06; mapping rates 73.85-75.95%; 99 of 22,397 tested genes reach FDR < 0.05 (57 heat-higher, 42 heat-lower); PC1 explains 26.3% of variance and separates most heat from control libraries though heat_A overlaps the controls"
analysis_status: "raw_reanalysis_harmonized"
