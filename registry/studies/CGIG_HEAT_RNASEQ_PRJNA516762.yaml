limitations:
  - "This intake represents molecular heat-stress response, not a direct survival or organism-level thermal-tolerance measurement."
  - "Each RNA-seq library pooled gill RNA from five oysters, so individual-level variability is unavailable."
  - "AREE independently reanalyzed the raw reads against GCF_963853765.1/RS_2024_06; the original study used legacy assembly GCA_000297895.1 and CGI/newGene identifiers, so these results are a current-reference reanalysis rather than an exact reconstruction of the publication pipeline."
  - "The direct heat-versus-control contrast yields modest differential expression (99 genes at FDR <= 0.05 of 22,397 tested), and PC1 (26.3% of variance) separates most but not all libraries, with heat_A overlapping the controls."
  - "The HSF1 RNAi-only and RNAi-plus-heat contrasts are preserved in the source workbook but excluded from this direct heat-versus-control reanalysis."
