limitations:
  - "The contrast uses only the 0 h libraries. They were sampled when the OsHV-1 mu-Var donor oysters were added, so they capture starvation without infection. The other 71 deposited libraries (3-72 h) follow each diet through infection, when the fed spat carry far more virus. A diet effect pooled across that time course would mix starvation with differential infection progression, so they are not used here."
  - "Each tank held both families, so the F11N and F14R libraries with the same replicate number probably share a tank. The public metadata do not state that replicate numbers correspond to tanks. The model ~ family + condition treats the six libraries per diet as independent, although only three tanks per diet are independent units, so the error model may be somewhat optimistic."
  - "The two families differ strongly in POMS susceptibility and in how much starvation protected them, so a single diet effect averaged over both may hide family-specific responses."
  - "The ENA sample titles call every time point 'hours post-infection', including 0 h. The publication shows the 0 h pools were sampled at the start of cohabitation, before viral DNA load rose."
  - "The publication reports 84 sequenced libraries and 83 are deposited; the starved F14R 6 h replicate 3 is absent. It also excluded one F11N 48 h replicate 2 library with 21% mapping without naming its diet, and both such libraries are deposited. Neither affects the 0 h contrast."
  - "The STAR Methods key-resources table swaps the two RNA-seq accessions (PRJEB86618 'for the Fed condition'). The data statement, the ENA study titles and every ENA sample title agree that PRJEB86618 is the starved arm and PRJEB86525 the fed arm, and the manifest follows them."
  - "Condition, family, time and replicate come from the ENA sample aliases and titles (sam_P_<family>_<3 fed | 5 starved>_<hours>_<replicate>), and the two sources agree for every library."
  - "The publication aligned reads with STAR to the Penaloza et al. 2021 assembly and analysed the 0 h diet contrast with WGCNA, treating the families as replicates, not with a per-gene differential expression test. Supplementary Table S5 lists the 13,238 genes in the three diet-associated modules (6,307 in the fed-associated turquoise module; 3,603 blue and 3,328 brown starved-associated), with module membership scores and, for 9,540 of them, an NCBI GeneID. It supports a direction-level comparison but gives no effect sizes or per-gene significance."
  - "The DECICOMP 30 C fed arm (PRJEB86646) shares the same families, design and fed controls, but the publication does not use it and it is outside this record."
