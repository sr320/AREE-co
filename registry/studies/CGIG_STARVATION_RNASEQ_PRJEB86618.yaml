stressor_class: "nutritional_limitation"
exposure:
  intensity: "complete food deprivation versus ad libitum phytoplankton; weight gain over 16 days was 15.3% (F14R) and 19.3% (F11N) starved versus 95.7% and 90.2% fed, with lower triacylglycerol reserves"
  duration: "16 days"
  timing: "chronic; the AREE contrast uses the 0 h sample taken at the end of acclimation, when OsHV-1 mu-Var donor oysters were added"
phenotype: "disease_resistance"
phenotype_direction: "Lower mortality after OsHV-1 mu-Var cohabitation is favorable. Starved spat had lower final mortality than fed spat (F14R 34.8% versus 75.5%; F11N 93.3% versus 100%; log-rank p < 0.05 in both families), and deaths began later (120 h versus 72-96 h post-cohabitation). AREE records the whole-spat transcriptional state produced by starvation before infection, not survival per library."
phenotype_units: "percent final mortality after OsHV-1 mu-Var cohabitation"
resilience_classification: "resilience_associated"
sample_size: 12
biological_replication: "12 RNA-seq libraries used for the contrast, all sampled at 0 h post-cohabitation: 6 fed and 6 starved, three per diet in each of the two families. Each library pools the soft tissue of 10 live spat taken from one tank. The experiment used three tanks per diet, and each tank held both families."
