limitations:
  - "Each library was sequenced on two lanes; the lanes are technical duplicates of one library, not replicates. Only the lower-numbered lane of each pair is used (26 of the 52 deposited runs, 136.8 GB instead of about 274 GB). The unused run is named in each manifest row."
  - "The primary contrast, ~ timepoint + condition, blocks on sampling time and treats the 13 time-matched pools per diet as replicates, as the publication did. The publication's central finding is that A. minutum remodels the daily cycling of gill transcripts, so a diet effect averaged over time will miss, or dilute, effects confined to part of the cycle."
  - "Diet is partly confounded with sequencing pool. The libraries were multiplexed into four pools, each on its own lane pair of one flowcell. Pool L003-L004 holds 6 A. minutum libraries and no controls, and pool L005-L006 holds 6 controls and 1 A. minutum library; pools L001-L002 and L007-L008 carry both diets. A sensitivity model with sequencing_pool as a covariate should accompany the primary result."
  - "Each diet used three tanks, but the publication does not say how the 6 oysters in each pool were drawn from them, so tank effects cannot be modelled."
  - "Timepoint labels are Day and Zeitgeber time rounded down: d1_zt04 is Day 1 ZT 4.5 and d3_zt04 is Day 3 ZT 4.5, where ZT 0 is lights on. The methods list the same 13 times as the ArrayExpress SDRF."
  - "Condition, time and lane come from the ArrayExpress E-MTAB-5345 SDRF (feeding condition, time and assay name), and every ENA sample alias matches its SDRF source name."
  - "The publication aligned reads with STAR to the Ensembl Metazoa C. gigas genome and mitochondrial genome and tested diet with edgeR across the 13 times, reporting 740 differentially expressed transcripts at FDR < 0.01 (89.5% higher under A. minutum). The transcript list is not in the supplement, whose only table lists the 30 most significant cycling transcripts per class, so only the count and direction balance can be compared."
