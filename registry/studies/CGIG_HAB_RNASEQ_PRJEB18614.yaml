phenotype_direction: "A. minutum exposure is unfavorable. The publication reports remodelling of the gill cycling transcriptome (loss of oscillations, de novo oscillating transcripts, shortened periods) and toxin accumulation, not survival. AREE records the time-averaged gill transcriptional response to the toxic diet."
