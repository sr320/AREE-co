citation: "Payton L, Perrigault M, Hoede C, Massabuau JC, Sow M, Huvet A, Boullot F, Fabioux C, Hegaret H, Tran D. Remodeling of the cycling transcriptome of the oyster Crassostrea gigas by the harmful algae Alexandrium minutum. Sci Rep. 2017;7:3480."
species: "Crassostrea gigas"
strain_population_family: "Diploid oysters from the Bay of Arcachon, France (72.8 mm shell length, 38.5 g total fresh weight); genetic background not reported"
genome_assembly: "GCF_963853765.1"
annotation_version: "RS_2024_06"
assay_type: "rnaseq"
tissue: "gill"
life_stage: "adult"
experimental_treatment: "Continuous feeding on the paralytic shellfish toxin-producing dinoflagellate Alexandrium minutum (strain AM89BM) at about 400 cells/mL, mimicking a bloom"
control_condition: "Continuous feeding on the non-toxic dinoflagellate Heterocapsa triquetra, sampled at the same times"
stressor_class: "harmful_algal_bloom_exposure"
exposure:
  intensity: "about 400 A. minutum cells/mL; gills accumulated 95.8 +/- 13.5 ng/g STX-equivalent paralytic shellfish toxins, and control gills none (ELISA)"
  duration: "sampled every 4 h over 52 h of exposure, after 6 days of pre-exposure to H. triquetra"
  timing: "acute, time-course sampling across three light:dark cycles (L:D 9:15, 15 C)"
phenotype: "metabolic_resilience"
phenotype_direction: "A. minutum exposure is unfavorable. The publication reports remodelling of the gill cycling transcriptome (loss of oscillations, de novo oscillating transcripts, shortened periods) and toxin accumulation, not survival. AREE records the time-averaged gill transcriptional response to the toxic diet."
phenotype_units: null
resilience_classification: "stress_response"
sample_size: 24
biological_replication: "26 RNA-seq libraries: one pool of gill RNA from 6 oysters for each of 13 sampling times in each diet. Both diets were sampled at the same 13 times, giving 13 time-matched pairs. There is no replication within a diet-by-time cell. Each diet used three tanks."
platform: "Illumina HiSeq 2500, 100 bp paired-end, stranded TruSeq mRNA"
data_availability:
  raw: true
  processed: false
  status: "public_raw_aree_reanalysis_complete"
quality_control_status: "All 819,493,060 read pairs from 26 one-lane libraries quantified with Salmon 2.3.4 against GCF_963853765.1/RS_2024_06 (12 runs from ENA FASTQs, 14 from NCBI .sra archives); mapping rates 68.33-77.33% (median 70.57%). Both day 2 ZT 8.5 pools are contaminated with adductor muscle (myosin, paramyosin, tropomyosin, titin: 23-27% of reads in the top 20 genes against about 6%) and dominated PC1 (79.7%), so the primary contrast drops that time-matched pair (12 versus 12, ~ timepoint + condition): 6,980 of 23,588 tested genes reach FDR < 0.05 (3,690 A. minutum-higher, 3,290 lower), PC1 (35.6%) separates every A. minutum pool from every control, and within-group BCV is 13.7%. With all 26 pools 6,872 genes are significant (log2FC r = 0.982). Blocking also on sequencing pool keeps 99.9% of significant genes in the same direction (log2FC r = 0.794) but only 53.8% significant (4,138 genes), because two of the four pools hold almost one diet each. Mapping is slightly higher in A. minutum pools at matched times (71.3% versus 70.2%, paired p = 0.003)"
analysis_status: "raw_reanalysis_harmonized"
