biological_replication: "26 RNA-seq libraries: one pool of gill RNA from 6 oysters for each of 13 sampling times in each diet. Both diets were sampled at the same 13 times, giving 13 time-matched pairs. There is no replication within a diet-by-time cell. Each diet used three tanks."
