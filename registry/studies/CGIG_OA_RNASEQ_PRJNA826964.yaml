limitations:
  - "No publication is linked to the BioProject, and searches of PubMed, Europe PMC full text and Crossref on 2026-09-28 found none, so there are no published methods, results or effect tables to reconcile the reanalysis against."
  - "The acidification intensity (target pH or pCO2), seawater carbonate chemistry, temperature and oyster size or age are not recorded in the public metadata, so exposure intensity and life stage are unresolved."
  - "The primary AREE contrast pools all acidified libraries against all controls and blocks on sampling day (~ timepoint + condition); it estimates an acidification effect averaged over 7, 28 and 56 days rather than time-specific or acclimation effects, and each day-by-condition cell has only three libraries."
  - "Condition, sampling day and replicate were taken from NCBI BioSample treatment and replicate attributes and agree with the library names (C/O = control/acidified, followed by day and replicate)."
  - "The BioProject carries no author-deposited processed expression matrix."
