quality_control_status: "All 435,657,730 read pairs quantified with Salmon 2.3.4 against GCF_963853765.1/RS_2024_06; mapping rates 78.62-81.26% (median 79.79%), equal across arms (control 79.9% versus acidified 79.9%); expressed-SNP allele frequencies at 2,837 sites show the three libraries in each day-by-condition cell are one pooled RNA sample (within-cell mean difference 0.040-0.057 against 0.039 expected from resequencing the same RNA, r = 0.95; between cells 0.078-0.317), so the 18 libraries were collapsed to 6 pools and tested as ~ timepoint + condition; 890 of 24,681 tested genes reach FDR < 0.05 (301 acidified-higher, 589 acidified-lower) against 10,797 when the libraries were treated as replicates; PC1 (35.9%) separates acidified_d56 from the other five pools and PC2 (29.7%) separates the arms"
