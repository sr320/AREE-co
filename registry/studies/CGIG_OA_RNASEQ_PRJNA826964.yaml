limitations:
  - "No publication is linked to the BioProject, and searches of PubMed, Europe PMC full text and Crossref on 2026-09-28 found none, so there are no published methods, results or effect tables to reconcile the reanalysis against."
  - "The acidification intensity (target pH or pCO2), seawater carbonate chemistry, temperature and oyster size or age are not recorded in the public metadata, so exposure intensity and life stage are unresolved."
  - "The treatment was probably CO2-driven acidification to pH 7.50. This is inferred, not documented: the same IOCAS group (L. Qiu and colleagues) ran C. gigas CO2 exposures at pH 7.50 sampled from 7 to 56 days (Wang et al. 2021, Ecotoxicol Environ Saf, doi:10.1016/j.ecoenv.2021.112235) and at pH 7.50 for 7 and 60 days (Wang et al. 2020, Sci Total Environ, doi:10.1016/j.scitotenv.2020.140177), and reported hepatopancreas responses to acidification over about two months (Zhang et al. 2021, J Oceanol Limnol, doi:10.1007/s00343-021-0462-x). None of these papers is linked to PRJNA826964, and the closed-access hepatopancreas paper, the most likely companion, has not been checked against it."
  - "The primary AREE contrast compares the three acidified pools with the three control pools and blocks on sampling day (~ timepoint + condition); it estimates an acidification effect averaged over 7, 28 and 56 days rather than time-specific or acclimation effects, and it has only two residual degrees of freedom."
  - "The three libraries per day-by-condition cell are technical replicates of one pooled RNA sample, not the independent biological replicates the BioSample attributes state. Expressed-SNP allele frequencies (scripts/check_replicate_genotypes.py, 4M read pairs per library) agree within a cell to within resequencing noise and show no single-animal genotype peaks, and within-cell expression dispersion is 2.7% BCV against 10.8-22.4% in the other AREE oyster studies. Treating the 18 libraries as replicates inflates significance roughly twelvefold, so the libraries are summed into 6 pools (--collapse-by=condition+timepoint)."
  - "Each pool is a different set of animals, and the acidified pools are genetically further from the controls (mean allele-frequency difference 0.24-0.31) than the control pools are from one another (0.085-0.19), so acidified and control oysters may come from different stocks or families. Several of the strongest effects are 4-6 log2 changes in transposon-derived genes (tigger, HARBI1), the pattern expected from presence-absence variation between genetic backgrounds, so part of the contrast may be genetic rather than an acidification response. For this reason the result is recorded but not harmonized into the evidence base."
  - "Condition, sampling day and replicate were taken from NCBI BioSample treatment and replicate attributes and agree with the library names (C/O = control/acidified, followed by day and replicate)."
  - "The BioProject carries no author-deposited processed expression matrix."
