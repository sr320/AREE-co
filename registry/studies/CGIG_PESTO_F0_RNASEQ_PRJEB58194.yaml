phenotype_direction: "The publication found no difference in embryo-larval abnormalities at 24 hpf, disturbed swimming, larger and heavier exposed larvae at some times, a lower epinephrine-induced metamorphosis rate and higher field survival, and differential expression of developmental genes (Hox orthologues, cell-cycle regulators) in gastrulae. AREE records the transcriptional response averaged over two stages."
