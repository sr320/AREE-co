citation: "George MN, Cattau O, Middleton MA, Lawson D, Vadopalas B, Gavery M, Roberts SB. Triploid Pacific oysters exhibit stress response dysregulation and elevated mortality following heatwaves. Glob Chang Biol. 2023;29(24):6969-6987."
species: "Crassostrea gigas"
strain_population_family: "2-year-old diploid and triploid oysters from a commercial grower, collected at Quilcene, Washington, USA (47.76 N, 122.85 W)"
genome_assembly: "GCF_963853765.1"
annotation_version: "RS_2024_06"
assay_type: "rnaseq"
tissue: "gill"
life_stage: "adult"
experimental_treatment: "Held in 30 C seawater, then emersed in air at 44 C for 6 h (multiple stressor, seawater heat followed by aerial heat over a tidal cycle)"
control_condition: "Held submerged at 20 C (control)"
stressor_class: "multi_stressor_exposure"
exposure:
  intensity: "30 C seawater followed by 6 h aerial emersion at 44 C, against 20 C submerged"
  duration: "30 C exposure followed by 6 h emersion at 44 C"
  timing: "acute; replicates conditions of the June 2021 Pacific Northwest atmospheric heatwave over a tidal cycle; ctenidium sampled 2021-07-12"
phenotype: "thermal_tolerance"
phenotype_direction: "Mortality after the multiple stressor was higher in triploids than diploids (36.4% versus 14.8%), with metabolic depression and reduced ctenidium Na/K-ATPase activity in triploids. AREE records the ctenidium transcriptional response averaged over ploidy, not survival per library."
phenotype_units: "percent mortality"
resilience_classification: "stress_response"
sample_size: 42
biological_replication: "42 ctenidium libraries analysed, one oyster each (23 controls and 19 treated after QC exclusions), from 48 sequenced: 24 controls and 24 30 C + 44 C emersion, 12 diploid and 12 triploid in each arm. The 24 control libraries are shared with CGIG_HEAT_RNASEQ_PRJNA913164 (30 C seawater only)."
platform: "Illumina NovaSeq 6000, QuantSeq 3' mRNA-Seq (Tag-seq), 101 bp single-end"
data_availability:
  raw: true
  processed: true
  status: "public_raw_aree_reanalysis_complete"
quality_control_status: "Salmon 2.3.4 (--noLengthCorrection, sequence-bias correction) against GCF_963853765.1/RS_2024_06 on all 72 QuantSeq libraries; mapping rates are low for 3' tag-seq against the annotated transcriptome (18.7-46.4%, median 34.3%, among the 63 analysed libraries) but similar across arms (control 31.7%, 30 C + 44 C emersion 34.4%). Nine libraries were left out because their median VST correlation with the other libraries fell below the median minus three robust SDs (0.834): N56, X44, X42, T62, R53, N54 and M43, which the authors also excluded, and R62 and N57; the authors' eighth exclusion, D54, passes and is kept. Tested as ~ ploidy + condition on counts without the tximport length offset (23 control v 19 30 C + 44 C emersion): 3,236 of 17,808 tested genes reach FDR < 0.05 (1,655 higher, 1,581 lower); PC1 12.8%, PC2 10.3%. A ploidy-by-treatment likelihood-ratio test finds 26 genes with FDR < 0.05; within-ploidy Wald tests give 1,979 diploid and 1,347 triploid significant genes, with log2 fold changes correlated 0.30 across all tested genes. Of the publication's diploid and triploid multiple-stressor gene lists, 98.2% and 96.7% of genes tested here change in the same direction (99.7% and 99.5% among genes also significant here). The response: heat shock protein 68 genes rise up to about 360-fold (log2FC up to 8.5; 14 of 20 significant heat shock protein genes higher) with calreticulin and SR splicing factors, while high-mobility-group proteins and nucleolin fall."
analysis_status: "raw_reanalysis_harmonized"
provenance:
  source_links:
    - "https://doi.org/10.1111/gcb.16880"
