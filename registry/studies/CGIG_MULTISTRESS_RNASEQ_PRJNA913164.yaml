limitations:
  - "The BioSamples carry no treatment or ploidy attribute. Both come from the description column of the authors' NCBI submission sheet (github.com/mattgeorgephd/NOPP-gigas-ploidy-temp, 202107_EXP2/tag-seq/NCBI/attributes.tsv), matched to BioSample by isolate name; sample-name prefixes do not map one-to-one to groups."
  - "The study has three arms that share one control group. AREE records each stressor against the 20 C controls as its own study (CGIG_HEAT_RNASEQ_PRJNA913164 (30 C seawater only) is the other), so the two records share their reference group and their effect estimates are correlated; they must not be treated as independent in a meta-analysis."
  - "Diploids and triploids are pooled with ploidy as a blocking factor (~ ploidy + condition), so the effect is averaged over ploidy. The publication's main finding is that triploids respond differently, especially to the multiple stressor; the ploidy-by-treatment interaction is reported in the quality-control summary, and ploidy-specific effects are not part of this record."
  - "QuantSeq 3' tag-seq yields about one read per transcript, so Salmon was run with --noLengthCorrection and DESeq2 used the counts without the tximport length offset (--tag-seq=yes). Library sizes are small (0.9-8.3 million reads), and isoform-level information is not recoverable."
  - "The authors excluded eight libraries as outliers (D54, N56, X44, R53, M43, N54, X42, T62). AREE quantified all 72 and applied its own rule (median VST correlation below the median minus three robust SDs): seven of the authors' eight fail it, D54 passes and is kept, and R62 and N57 also fail and are left out. The exclusions live in scripts/prepare_prjna913164_fastqs.py and remove one or two libraries from some ploidy-by-treatment cells."
  - "The expressed-SNP replicate check (scripts/check_replicate_genotypes.py) could not be run: 3' tags cover too little of the target transcripts (about 2,000 usable reads per library, even after poly-A and adapter trimming) to call allele frequencies. Each library is a single adult oyster according to the publication, so no pooling or resequencing is expected, but this was not verified genetically."
