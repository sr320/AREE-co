biological_replication: "48 ctenidium libraries, one oyster each: 24 controls and 24 30 C + 44 C emersion, 12 diploid and 12 triploid in each arm. The 24 control libraries are shared with CGIG_HEAT_RNASEQ_PRJNA913164 (30 C seawater only)."
