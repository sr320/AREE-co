limitations:
  - "The six 23 C fed control libraries (PRJEB86525, 0 h) are the same libraries used as controls in CGIG_STARVATION_RNASEQ_PRJEB86618. The two harmonized studies therefore share a reference group, so their effect estimates are correlated and must not be treated as independent in a meta-analysis."
  - "The contrast uses only the 0 h libraries, sampled when the OsHV-1 mu-Var donors were added, so it captures temperature without infection. The 36 later libraries (3-72 h) follow infection, which progresses far less at 30 C, and are not used."
  - "Each tank held both families, so the F11N and F14R libraries with the same replicate number probably share a tank. The model ~ family + condition treats the six libraries per temperature as independent, although only three tanks per temperature are independent units."
  - "The 30 C arm and the 23 C controls were held in separate tanks of one experiment at the Argenton station, so tank is nested in temperature."
  - "Condition, family, time and replicate come from the ENA sample aliases and titles (sam_P_<family>_<3 fed 23 C | 4 fed 30 C>_<hours>_<replicate>), and the two sources agree for every library."
  - "The publication reports enhanced baseline antiviral immunity at 30 C. At 0 h this reanalysis finds the opposite for several classic antiviral markers: all 13 significant interferon-induced protein 44 genes, 10 of 12 significant tumor necrosis factor genes and both significant 2'-5'-oligoadenylate synthetase genes are lower at 30 C. The publication is not open access and its gene lists were not compared, so whether this reflects different gene sets, a different time point or a real disagreement is unresolved."
  - "Pools at 30 C map about three points less to the transcriptome than pools at 23 C. The shift is systematic but small beside the expression effects."
