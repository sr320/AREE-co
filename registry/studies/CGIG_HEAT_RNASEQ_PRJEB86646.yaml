citation: "Duperret L, Valdivieso A, Kunselman E, Petton B, Morga B, de Lorgeril J, Pernet F, Degremont L, Faury N, Allienne JF, Pouzadoux J, Romatif O, Courtay G, Monaco CJ, Toulza E, Delisle L, Vidal-Dupiol J, Lagorce A, Mitta G. Deciphering the molecular mechanisms of oyster resistance to Pacific Oyster Mortality Syndrome (POMS) disease induced by high temperatures. Sci Total Environ. 2025;994:180026."
species: "Crassostrea gigas"
strain_population_family: "Two POMS-susceptible full-sib G1 families (F11N, F14R) bred at the Ifremer Bouin hatchery from G0 families whose parents were wild oysters from Dellec, Rade de Brest"
genome_assembly: "GCF_963853765.1"
annotation_version: "RS_2024_06"
assay_type: "rnaseq"
tissue: "whole_soft_tissue"
life_stage: "spat"
experimental_treatment: "Fed ad libitum and held at 30 C (non-permissive for POMS) through the DECICOMP acclimation (PRJEB86646)"
control_condition: "Fed ad libitum and held at 23 C (permissive for POMS) for 16 days (DECICOMP control arm, PRJEB86525)"
stressor_class: "temperature"
exposure:
  intensity: "30 C against 23 C, both fed the same microalgae mixture ad libitum"
  duration: "16-day acclimation in the shared DECICOMP protocol (Duperret et al. 2026 iScience); the ramp to 30 C and the exact 30 C duration are in the Sci Total Environ paper, which is not open access and was not checked"
  timing: "chronic; the AREE contrast uses the 0 h sample taken at the end of acclimation, when OsHV-1 mu-Var donor oysters were added"
phenotype: "disease_resistance"
phenotype_direction: "Lower mortality after OsHV-1 mu-Var cohabitation is favorable. The publication reports that 30 C limits POMS development and improves survival, through metabolic reprogramming and stronger baseline and induced antiviral immunity. AREE records the whole-spat transcriptional state at 30 C before infection, not survival per library."
phenotype_units: "percent final mortality after OsHV-1 mu-Var cohabitation"
resilience_classification: "resilience_associated"
sample_size: 12
biological_replication: "12 RNA-seq libraries, all sampled at 0 h post-cohabitation: 6 at 23 C and 6 at 30 C, three per temperature in each of the two families. Each library pools the soft tissue of 10 live spat taken from one tank, as in the DECICOMP starvation arm."
platform: "Illumina NextSeq 550, 75 bp single-end (76 bp as deposited)"
data_availability:
  raw: true
  processed: true
  status: "public_raw_aree_reanalysis_complete"
quality_control_status: "All 321,328,949 single-end reads quantified with Salmon 2.3.4 (sequence-bias correction; GC-bias correction is not fitted for single-end reads) against GCF_963853765.1/RS_2024_06; mapping rates 64.29-69.05%, about three points lower at 30 C than 23 C (65.5% versus 68.2%, with no overlap between arms), a systematic shift like the two points seen under starvation; 9,024 of 25,355 tested genes reach FDR < 0.05 under ~ family + condition (4,542 higher and 4,482 lower at 30 C); PC1 (60.7%) separates every 30 C pool from every 23 C pool and PC2 (31.1%) separates the families. The pools are independent and temperature is not confounded with genotype: expressed-SNP allele frequencies differ by 0.100 between pools of one family at the same temperature, against 0.040 simulated for one RNA resequenced, and by 0.099 between pools of one family at different temperatures (0.353 between families). Small heat shock proteins are among the strongest 30 C-higher genes (all 7 significant heat shock protein genes are higher), and asparagine synthetase and glycogen-branching enzyme fall. Fold changes are uncorrelated with the starvation contrast that shares these controls (r = -0.05 over 24,836 genes)."
analysis_status: "raw_reanalysis_harmonized"
