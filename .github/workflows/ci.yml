name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.resolution }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the lowest dependency versions pyproject.toml allows,
          # and the newest Python with the newest dependencies.
          - python: "3.8"
            resolution: lowest-direct
            extras: dev
          - python: "3.13"
            resolution: highest
            extras: dev,app  # app smoke tests need streamlit >= 1.28; they skip without it
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install --resolution ${{ matrix.resolution }} -e ".[${{ matrix.extras }}]"
      - run: ruff check .
        if: matrix.resolution == 'highest'
      - run: pytest
      - run: aree validate-study registry/studies/CGIG_HEAT_RNASEQ_001.yaml
      - run: aree harmonize-demo
      - run: aree meta-analyze --phenotype thermal_tolerance --feature-type gene
      - run: aree score-candidates
      - run: aree build-evidence-cards
      - run: aree build-demo-report
      - name: Demo outputs are reproducible
        # status (not diff) so new untracked outputs, e.g. a renamed card, also fail the check
        run: |
          git status --porcelain -- data/demo reports
          git diff -- data/demo reports
          test -z "$(git status --porcelain -- data/demo reports)"

  wheel:
    # A regular (non-editable) install must work: schemas ship in the package and the project
    # directory is found from the working directory, not from the package location.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python 3.13 /tmp/wheel-env && VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
      - name: Installed package runs against the checkout
        run: |
          /tmp/wheel-env/bin/python -c "import aree, sys; assert '/tmp/wheel-env/' in aree.__file__, aree.__file__"
          /tmp/wheel-env/bin/aree validate-study registry/studies/CGIG_HEAT_RNASEQ_001.yaml
          /tmp/wheel-env/bin/aree harmonize-demo --output /tmp/evidence.tsv
          cmp /tmp/evidence.tsv data/demo/harmonized_evidence.tsv

  pipeline:
    # Full workflows/rnaseq run on synthetic reads with the pinned toolchain from environment.yml.
    name: nextflow rnaseq (synthetic data)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflows/rnaseq/environment.yml
          environment-name: aree-rnaseq
          # Flexible priority: under strict priority conda-forge's R packages block bioconda's R 4.3 DESeq2.
          create-args: >-
            --channel-priority flexible
            python=3.12
            pip
            nextflow
            openjdk=17
          cache-environment: true
      - run: python -m pip install -e ".[dev]"
      - run: pytest -v tests/test_nextflow_rnaseq.py
        env:
          AREE_REQUIRE_PIPELINE: "1"

